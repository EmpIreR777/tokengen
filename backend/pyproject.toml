[project]
name = "tokengen"
version = "0.1.0"
description = "Token Generation Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
lint = [
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
cache-dir = ".ruff_cache"


[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "COM",
    "E",
    "F",
    "I",
    "N",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "ANN003",
    "ANN401",
    "ARG001",
    "ARG005",
    "B008",
    "B904",
    "COM812",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = [
    "E402",
    "F401",
    "E501",
]
"backend/alembic/*" = [
    "E402",
    "F401",
    "E501",
]
"tests/*" = [
    "ANN",
    "S101",
    "S105",
    "S106",
]
"backend/tests/*" = [
    "ANN",
    "S101",
    "S105",
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
mypy_path = ["$MYPY_CONFIG_FILE_DIR"]
cache_dir = "$MYPY_CONFIG_FILE_DIR/.mypy_cache"
explicit_package_bases = true
strict = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
python_version = "3.11"
exclude = [
    "tests/",
    "migrations/",
]

# apscheduler не распространяет py.typed — стабов нет, проверяем только наш код.
[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.codespell]
ignore-words-list = "selectin,ot"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
